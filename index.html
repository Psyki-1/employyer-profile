<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Card Component</title>
    <link rel="stylesheet" href="profile.css" />
      <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@400;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <main class="card">
      <div class="card-header">
        <img src="Images/bg-pattern-card.svg" alt="" class="card-bg" />
      </div>

      <div class="card-body">
        <img src="Images/image-victor.jpg" alt="Victor Crest" class="avatar" />
        
        <div class="user-info">
          <h2 class="name">Victor Crest <span class="age"> 26</span></h2>
          <p class="location">London</p>
        </div>
      </div>
        
        <hr>
        
      <div class="card-stats">
        <div class="stat-item">
          <h2>80K</h2>
          <p class="description">Followers</p>
        </div>
        <div class="stat-item">
          <h2>803K</h2>
          <p class="description">Likes</p>
        </div>
        <div class="stat-item">
          <h2>1.4K</h2>
          <p class="description">Photos</p>
        </div>
      </div>
    </main>
  </body>
</html>
